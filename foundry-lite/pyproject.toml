[project]
name = "foundry"
version = "0.4.0"
description = "Gate-based CI pipeline runner for local and scheduled workflows"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Scott Nixon"}]
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "croniter>=2.0",
  "anthropic>=0.25",
  "google-genai>=1.0",
  "watchdog>=4.0",
]

[project.scripts]
foundry = "foundry.cli:main"

[project.urls]
Repository = "https://github.com/citadelgrad/foundry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
