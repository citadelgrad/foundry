version: 1

profiles:
  security:
    docker:
      image: foundry-runner:local
      volumes:
        - ~/.claude:/home/node/.claude:ro
    gates:
      - id: owasp-scan
        run: claude -p "/security-review" --dangerously-skip-permissions
        timeout: 30m
        allow_failure: true
        decision_on_failure: warn
      - id: ubs-scan
        run: ubs . --profile=strict --format=toon
        timeout: 30m
        allow_failure: true
        decision_on_failure: warn

  triage:
    parallel: false
    gates:
      - id: ruff
        run: cd foundry-lite && uv run ruff check .
        timeout: 5m
      - id: test
        run: cd foundry-lite && uv run pytest
        timeout: 10m

schedules:
  weekly-security-foundry:
    profile: security
    cron: "0 4 * * 0"
  triage-foundry:
    profile: triage
    cron: '0 10 * * 2'
